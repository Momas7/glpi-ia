services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: glpi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: glpi_ia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glpi -d glpi_ia"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      target: web
    environment: &app-env
      DATABASE_URL: postgresql://glpi:${POSTGRES_PASSWORD}@postgres:5432/glpi_ia
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      AI_ENABLED: ${AI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_DAILY_BUDGET: ${AI_DAILY_BUDGET:-5}
      AI_TRIAGE_MIN_CONFIDENCE: ${AI_TRIAGE_MIN_CONFIDENCE:-0.6}
      AI_AUDIT_RETENTION_DAYS: ${AI_AUDIT_RETENTION_DAYS:-30}
      AI_MODEL_TRIAGE: ${AI_MODEL_TRIAGE:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_RAG_MIN_SIMILARITY: ${AI_RAG_MIN_SIMILARITY:-0.6}
      AI_MODEL_DRAFT: ${AI_MODEL_DRAFT:-}
      AI_MODEL_SUMMARY: ${AI_MODEL_SUMMARY:-}
      AI_DUPLICATE_MIN_SIMILARITY: ${AI_DUPLICATE_MIN_SIMILARITY:-0.85}
      AI_DUPLICATE_WINDOW_HOURS: ${AI_DUPLICATE_WINDOW_HOURS:-72}
      AI_INCIDENT_MIN_SIMILARITY: ${AI_INCIDENT_MIN_SIMILARITY:-0.75}
      AI_INCIDENT_WINDOW_MINUTES: ${AI_INCIDENT_WINDOW_MINUTES:-30}
      AI_INCIDENT_MIN_TICKETS: ${AI_INCIDENT_MIN_TICKETS:-5}
      UPLOAD_DIR: /data/uploads
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      target: worker
    environment: *app-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
