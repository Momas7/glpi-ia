services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: glpi
      POSTGRES_PASSWORD: glpi
      POSTGRES_DB: glpi_ia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glpi -d glpi_ia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
