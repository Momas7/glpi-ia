version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react e react-dom precisam estar sempre na mesma versão
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
    ignore:
      # Node 24 é o runtime (Docker e CI): tipos de versões maiores deixariam passar APIs inexistentes
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint ainda não suporta TS 7; plugins do eslint-config-next só aceitam ESLint até 9
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
